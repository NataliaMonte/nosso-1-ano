<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N & E ❤️</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <h1>N & E</h1>

        <h2>Nosso Primeiro Ano</h2>

        <div class="countdown">

            <div class="card">
                <span id="dias">00</span>
                <small>Dias</small>
            </div>

            <div class="card">
                <span id="horas">00</span>
                <small>Horas</small>
            </div>

            <div class="card">
                <span id="minutos">00</span>
                <small>Minutos</small>
            </div>

            <div class="card">
                <span id="segundos">00</span>
                <small>Segundos</small>
            </div>

        </div>

        <p class="texto">
            Cada segundo me aproxima de celebrar mais um ano ao seu lado.
        </p>

    </main>

    <script src="js/countdown.js"></script>

</body>

</html>
